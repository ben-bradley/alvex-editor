[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alvex-editor"
version = "0.1.0"
description = "Alvex Editor - template-driven video editing and production"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Alvex Editor" },
]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/ben-bradley/alvex-editor"
Repository = "https://github.com/ben-bradley/alvex-editor"
Issues = "https://github.com/ben-bradley/alvex-editor/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
agent = [
  "mcp>=1.0.0,<3",
]
analysis = [
  "numpy>=1.24",
]

[project.scripts]
alvex-editor = "alvex_editor.cli:main"
alvex = "alvex_editor.cli:main"
alvex-editor-mcp = "alvex_editor.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
