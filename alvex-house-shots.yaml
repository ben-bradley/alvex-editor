# Project: 2026-10-29 House Shots
# Clips/soundtrack and outputs in the same source folder (as requested).

name: house-shots-321-test-st
template: templates/exterior-showcase.md

clips_dir: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips"
soundtrack: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips/bensound-acousticbreeze.mp3"

# Output artifacts into the same folder as source clips
output_dir: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips"
timeline_path: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips/timeline.json"
analysis_path: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips/analysis.json"
sources_manifest: "D:/drone/2026-10-29 - House Shots/clips/RE Video Clips/RE Video Clips/sources.yaml"

variables:
  address: "321 Test St\nBryant, Arkansas"

ollama:
  host: http://127.0.0.1:11434
  model: qwen3-vl:latest
  vision_model: qwen3-vl:latest
  timeout: 240

analysis:
  backend: auto
  # Explicit end boundaries (seconds) for the 10 renderable segments, in template order.
  # Snapped to detected onsets near user anchors: 10s, 19s, 38s, 57s, 1m16s(76s).
  # [high-approach-front, mid-orbit-front, pan-front, approach-door, rise-up,
  #  high-orbit-front, high-orbit-back, mid-orbit-back, pan-back, departure]
  cut_points: [9.822, 19.2958, 28.816, 38.3129, 47.8331, 57.3068, 66.8502, 76.324, 85.2405, 98.8938]

render:
  fontfile: "C:/Windows/Fonts/arial.ttf"
  # Horizontally centered, middle of the bottom third of the frame.
  title_x: "(w-text_w)/2"
  title_y: "(h*5/6)-(text_h/2)"
  # Clean up light grain and boost vibrance a bit (tune as needed).
  video_filters:
    - "hqdn3d=1.5:1.5:4:4"
    - "vibrance=intensity=0.10"
  # 4K drone sources; use --preview for a faster check before final render.
